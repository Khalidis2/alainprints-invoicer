<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0B3F3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Print Doctor">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Doctor</title>
<style>
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --ink:#15232B; --muted:#5B6470; --line:#E1E6E3;
  --deep:#0B3F3B; --teal:#0F6B64; --teal-ink:#FFFFFF; --teal-soft:#E6F0EE; --accent:#7FD1C3;
  --orange:#F0B27A; --orange-ink:#3B1D05; --orange-soft:#FDECDC; --orange-text:#9A4A0B;
  --ok:#046046; --ok-soft:#DCF2EA; --bad:#B23A2E; --bad-soft:#F8E3E0;
  --nav:#15232B; --nav-ink:#B8C2C6; --field:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1615; --surface:#162220; --ink:#E6EFED; --muted:#93A6A2; --line:#26403B;
    --deep:#0A2F2C; --teal:#2FA79C; --teal-ink:#06201D; --teal-soft:#16332F; --accent:#7FD1C3;
    --orange-soft:#3A2617; --orange-text:#F0B27A;
    --ok:#5CC98A; --ok-soft:#14301F; --bad:#EE7C70; --bad-soft:#3A1916;
    --nav:#0A1110; --nav-ink:#8FA09C; --field:#0E1615;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.page{max-width:560px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}

/* hero */
.hero{background:var(--deep);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 92px;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--teal);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.sq{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:grid;place-items:center}
.sq svg{width:20px;height:20px}
.hero h1{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.chip[aria-pressed="true"]{background:#fff;color:var(--deep);border-color:#fff}
.chip b{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chip:nth-child(even) b{background:var(--orange)}

/* cards */
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:0 12px 32px rgba(11,63,59,.14);margin:-72px 16px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.finder{position:relative;min-height:168px;border-radius:16px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;padding:26px 20px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.finder i{position:absolute;width:26px;height:26px;border:3px solid var(--teal)}
.finder i:nth-of-type(1){top:14px;left:14px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.finder i:nth-of-type(2){top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.finder i:nth-of-type(3){bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.finder i:nth-of-type(4){bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.62);color:#fff;font-size:14px;line-height:24px;padding:0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;padding:0 14px}
.btn svg{width:18px;height:18px;flex:none}
.btn.main{min-height:56px;border:0;border-radius:16px;background:var(--teal);color:var(--teal-ink);font-size:17px;font-weight:800}
.btn.main svg{width:22px;height:22px}
.btn.dark{border:0;background:var(--deep);color:#fff}
.btn.sm{min-height:40px;border-radius:12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea,input[type=text],input[type=password]{width:100%;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}

/* lists */
.sec{padding:22px 16px 0;display:flex;flex-direction:column;gap:10px}
.sec .row{display:flex;justify-content:space-between;align-items:center}
.sec h2{font-size:17px;font-weight:800}
.link{background:none;border:0;color:var(--teal);font-size:14px;font-weight:700;min-height:44px;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:0;width:100%;text-align:left}
.item .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal)}
.item .ic.o{background:var(--orange-soft);color:var(--orange-text)}
.item .ic svg{width:22px;height:22px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted)}
.pill{flex:none;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}
.pill.fixed{background:var(--ok-soft);color:var(--ok)}
.pill.open,.pill.notfixed{background:var(--orange-soft);color:var(--orange-text)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.title{font-size:30px;font-weight:800;letter-spacing:-.02em;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.stat{padding:12px;border-radius:16px;background:var(--surface);display:flex;flex-direction:column}
.stat b{font-size:24px;font-weight:850;line-height:1.2}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
.stat.on{background:var(--teal);color:var(--teal-ink)}.stat.on span{color:inherit}
.stat.warn b{color:var(--orange-text)}
.tabs{margin:14px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:var(--line)}
.tabs button{min-height:40px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:800;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:8px;padding:12px 16px 0}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lessons li{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);font-size:14px}
.lessons li span.tx{flex:1}
.kind{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-top:1px}
.kind.worked{background:var(--ok-soft);color:var(--ok)}
.kind.failed{background:var(--bad-soft);color:var(--bad)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;min-width:32px;min-height:32px}

/* printers */
.pcard{border-radius:22px;background:var(--surface);overflow:hidden}
.pcard .top{padding:16px;background:var(--teal);color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard.o .top{background:var(--orange);color:var(--orange-ink)}
.pcard h2{font-size:20px;font-weight:800}
.pcard .top small{font-size:13px;opacity:.85}
.pcard .body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}.kv span{color:var(--muted)}.kv b{font-weight:800;text-align:right}
.rm{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:10px;font-size:12px;font-weight:800;padding:6px 10px;min-height:32px}
.add{min-height:56px;border-radius:18px;border:2px dashed var(--muted);background:transparent;font-weight:800;color:var(--muted)}
.addform{display:flex;gap:8px;flex-wrap:wrap}.addform input{flex:1;min-width:0}

/* nav */
.nav{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;height:64px;border-radius:22px;background:var(--nav);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;z-index:6}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;color:var(--nav-ink);font-size:11.5px;font-weight:700}
.nav button[aria-current="page"]{color:var(--accent);font-weight:800}
.nav svg{width:22px;height:22px}

/* case */
.chead{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px}
.chead .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.92);color:var(--deep);display:grid;place-items:center}
.back svg{width:22px;height:22px}
.chead .tt{flex:1;min-width:0}
.chead h1{font-size:18px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead small{font-size:13px;opacity:.8}
.chead .btn{min-height:40px;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:14px;padding:18px 16px 0}
.msg{padding:14px 16px;border-radius:20px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:88%;background:var(--teal);color:var(--teal-ink);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.bot{background:var(--surface);border-bottom-left-radius:6px}
.msg.bot h3{font-size:17px;font-weight:800;margin:14px 0 4px}.msg.bot h3:first-child{margin-top:0}
.msg.bot p{margin:6px 0}
.msg.bot ol,.msg.bot ul{margin:6px 0;padding-left:0;list-style:none;counter-reset:s}
.msg.bot ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.msg.bot ol li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal-soft);color:var(--deep);display:grid;place-items:center;font-size:13px;font-weight:800}
.msg.bot ol li.done{color:var(--muted);text-decoration:line-through}
.msg.bot ol li.done::before{content:"✓";background:var(--teal);color:var(--teal-ink)}
.msg.bot ul li{padding:4px 0 4px 18px;position:relative}.msg.bot ul li::before{content:"";position:absolute;left:4px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
.msg.bot code{background:var(--teal-soft);padding:1px 5px;border-radius:5px;font-size:.9em}
.msg.bot strong{color:var(--teal)}
.tip{font-size:12.5px;color:var(--muted);text-align:center}
.thinking{color:var(--muted);display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2;transform:scale(.6)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.verdict{background:var(--deep);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.verdict h3{font-size:18px;font-weight:800}
.verdict p{font-size:13.5px;color:#CFE3DF}
.verdict .two .btn{min-height:52px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);font-size:15px;font-weight:800}
.verdict .two .btn.go{background:#fff;color:var(--deep);border-color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.dock .thumbs{max-width:560px;margin:0 auto 8px;justify-content:flex-start}
.dock textarea{min-height:48px;max-height:140px;resize:none}
.ib{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.ib svg{width:22px;height:22px}
.ib.go{background:var(--teal);color:var(--teal-ink);border:0}
.casepad{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* lock */
.lock{min-height:100vh;background:var(--deep);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px;max-width:560px;margin:0 auto}
.lock input{text-align:center;font-size:20px;letter-spacing:.15em;color:var(--ink);background:#fff}
.lock .btn{background:var(--teal);color:#fff;border:0;min-height:54px;font-size:17px;font-weight:800;border-radius:16px}
</style>
</head>
<body>
<div id="hdr" hidden></div>
<main class="page" id="app"></main>
<nav class="nav" id="nav" aria-label="Main" hidden></nav>
<div class="dock" id="dock" hidden></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="picker" accept="image/*" multiple hidden>

<script>
(() => {
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app'), hdr = $('#hdr'), dock = $('#dock'), nav = $('#nav'), picker = $('#picker'), cam = $('#cam');
const MAX_IMGS = 4;
const lsGet = k => { try{ return localStorage.getItem(k) || ''; }catch{ return ''; } };
const lsSet = (k,v) => { try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch{} };

const S = { pass: 'admin', view: 'home', from: 'home', filter: 'all', cases: [], lessons: [], printers: [], cur: null,
  draft: '', draftPrinter: '', imgs: [], busy: false, ctl: null, err: '', loading: true, adding: false, typing: false, t0: 0 };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = t => { const d = new Date(typeof t === 'number' ? t : Date.parse(t)); return isNaN(d) ? '' : d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); };

/* ---------- tiny markdown ---------- */
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
function md(src){
  let out='', list=null;
  const close = () => { if(list){ out += `</${list}>`; list=null; } };
  for(const raw of String(src).split('\n')){
    const l = raw.trimEnd(); let m;
    if(m = l.match(/^\s*#{1,4}\s+(.*)/)){ close(); out += `<h3>${inline(m[1])}</h3>`; }
    else if(m = l.match(/^\s*\d+[.)]\s+(.*)/)){ if(list!=='ol'){ close(); out+='<ol>'; list='ol'; } out += `<li><span>${inline(m[1])}</span></li>`; }
    else if(m = l.match(/^\s*[-*•]\s+(.*)/)){ if(list!=='ul'){ close(); out+='<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if(!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  }
  close(); return out;
}

/* ---------- server ---------- */
// The admin app (parent page) hands this page a fresh sign-in token.
const getToken = () => new Promise(resolve => {
  const id = Math.random();
  const on = e => { if(e.data && e.data.pdTokenReply === id){ removeEventListener('message', on); resolve(e.data.token || ''); } };
  addEventListener('message', on);
  parent.postMessage({ pdToken: id }, location.origin);
  setTimeout(() => { removeEventListener('message', on); resolve(''); }, 4000);
});
async function api(path, opts = {}){
  const token = await getToken();
  const r = await fetch(path, { ...opts, headers: { 'Content-Type':'application/json', Authorization: 'Bearer ' + token } });
  const d = await r.json().catch(() => ({}));
  if(r.status === 401){ S.err = 'Please sign in again in the admin app.'; render(); throw Object.assign(new Error('locked'), { locked:true }); }
  if(!r.ok) throw new Error(d.error || 'Something went wrong. Check your internet.');
  return d;
}
const post = (body) => api('/api/print-doctor?r=data', { method:'POST', body: JSON.stringify(body) });

async function loadAll(){
  S.loading = true; render();
  try{
    const d = await api('/api/print-doctor?r=data');
    S.cases = d.cases; S.lessons = d.lessons; S.printers = d.printers; S.err = '';
  }catch(e){ if(!e.locked) S.err = e.message; }
  S.loading = false; render();
}

/* ---------- photos: shrink on the phone before sending ---------- */
async function prep(file){
  const bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  const sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const url = cv.toDataURL('image/jpeg', 0.85);
  return { mime:'image/jpeg', data:url.split(',')[1], url };
}
async function addFiles(input){
  let bad = 0, full = false;
  for(const f of input.files){
    if(S.imgs.length >= MAX_IMGS){ full = true; break; }
    try{ S.imgs.push(await prep(f)); }catch{ bad++; }
  }
  S.err = bad ? 'Some photos could not be read. Try JPG or PNG.' : full ? `Max ${MAX_IMGS} photos at a time.` : '';
  render();
}
cam.addEventListener('change', () => addFiles(cam));
picker.addEventListener('change', () => addFiles(picker));
function thumbs(){
  if(!S.imgs.length) return '';
  return `<div class="thumbs">${S.imgs.map((i,k) => `<div class="thumb"><img src="${i.url}" alt="Photo ${k+1}"><button data-rmimg="${k}" aria-label="Remove photo">×</button></div>`).join('')}</div>`;
}

/* ---------- ask ---------- */
async function ask(text){
  const imgs = S.imgs; const isNew = !S.cur.id;
  S.imgs = []; S.draft = ''; S.err = ''; S.busy = true; S.t0 = Date.now(); S.ctl = new AbortController();
  const n = imgs.length;
  S.cur.turns.push({ role:'user', content:(text || 'Please look at the photo and tell me what is wrong.') + (n ? `\n[${n} photo${n>1?'s':''} attached]` : ''), pending:true });
  render(); scrollEnd(); tick();
  try{
    const d = await api('/api/print-doctor?r=ask', { method:'POST', signal:S.ctl.signal, body: JSON.stringify({
      caseId: S.cur.id || null, text, printer: S.cur.printer, images: imgs.map(({mime,data}) => ({mime,data})) }) });
    S.cur = d.case;
    S.cases = [{ id:d.case.id, title:d.case.title, printer:d.case.printer, status:d.case.status, lesson:d.case.lesson, updated_at:d.case.updated_at },
      ...S.cases.filter(x => x.id !== d.case.id)];
  }catch(e){
    S.cur.turns = S.cur.turns.filter(t => !t.pending);
    if(e.name === 'AbortError'){ S.err = 'Stopped. (If it finishes anyway, it will show in History.)'; }
    else if(!e.locked) S.err = e.message;
    S.draft = text; S.imgs = imgs;
    if(isNew && !e.locked){ S.view = 'home'; S.cur = null; }
  }finally{
    S.busy = false; S.ctl = null; render(); scrollEnd();
  }
}
function tick(){
  if(!S.busy) return;
  const el = $('#elapsed'); if(el) el.textContent = Math.round((Date.now() - S.t0)/1000) + 's';
  setTimeout(tick, 1000);
}

async function verdict(worked){
  const c = S.cur; S.busy = true; S.err = ''; render();
  try{
    const d = await post({ action:'verdict', id:c.id, worked });
    S.lessons.unshift({ id: Date.now(), kind:d.kind, text:d.lesson, printer:c.printer || '', created_at:new Date().toISOString() });
    if(worked){ c.status = 'fixed'; c.lesson = d.lesson; }
    else{ c.status = 'notfixed'; S.draft = "That didn't fix it. What I see now: "; }
    const row = S.cases.find(x => x.id === c.id); if(row){ row.status = c.status; row.lesson = c.lesson; }
  }catch(e){ if(!e.locked) S.err = e.message; }
  S.busy = false; render(); scrollEnd();
  if(!worked){ const r = $('#reply'); if(r){ r.focus(); r.setSelectionRange(r.value.length, r.value.length); } }
}

/* ---------- icons ---------- */
const ico = {
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>',
  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  print: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 8h10M12 8v6M9 17h6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
};
const STATUS = { open:'Open', fixed:'Fixed', notfixed:'Not fixed' };

/* ---------- views ---------- */
function setNav(){
  nav.hidden = false;
  const item = (v, icon, label) => `<button data-go="${v}" ${S.view===v?'aria-current="page"':''}>${icon}${label}</button>`;
  nav.innerHTML = item('home', ico.cam, 'Scan') + item('history', ico.hist, 'History') + item('printers', ico.print, 'Printers');
}
function chrome(kind){   // kind: 'page' | 'case' | 'lock'
  hdr.hidden = kind !== 'case';
  nav.hidden = kind !== 'page';
  dock.hidden = kind !== 'case';
  app.className = kind === 'case' ? 'page casepad' : kind === 'lock' ? '' : 'page';
}
function render(){
  if(!S.pass || S.view === 'lock') return renderLock();
  if(S.view === 'case' && S.cur) return renderCase();
  chrome('page'); setNav();
  ({ history: renderHistory, printers: renderPrinters }[S.view] || renderHome)();
}
function renderLock(){
  chrome('lock');
  app.innerHTML = `<form class="lock" id="lockform">
    <div class="logo"><i>${ico.plus}</i>Print Doctor</div>
    <h1 style="font-size:28px;line-height:1.15;font-weight:800">Enter your passcode</h1>
    <label for="pass" hidden>Passcode</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="btn">Open</button>
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
  </form>`;
  $('#pass').focus();
}
function renderHome(){
  const chips = ['', ...S.printers].map(p => `<button class="chip" data-pick="${esc(p)}" aria-pressed="${S.draftPrinter===p}"><b></b>${p ? esc(p) : 'Any printer'}</button>`).join('');
  const recent = S.cases.slice(0, 3);
  const showText = S.typing || S.draft;
  app.innerHTML = `
  <section class="hero">
    <div class="bar"><div class="logo"><i>${ico.plus}</i>Print Doctor</div><button class="sq" data-go="printers" aria-label="My printers">${ico.gear}</button></div>
    <h1>What went wrong today?</h1>
    <div class="chips">${chips}</div>
  </section>
  <section class="card">
    <div class="finder"><i></i><i></i><i></i><i></i>${S.imgs.length ? thumbs() : 'Hold the print close.<br>Show the bad spot clearly.'}</div>
    <button class="btn main" id="scan">${ico.cam}${S.imgs.length ? 'Add another photo' : 'Scan the problem'}</button>
    <div class="two">
      <button class="btn" id="gallery">${ico.image}From gallery</button>
      <button class="btn" id="type">${ico.type}Type it</button>
    </div>
    ${showText ? `<textarea id="q" aria-label="Describe the problem" placeholder="Example: first layer not sticking on the corners, PLA, textured plate">${esc(S.draft)}</textarea>` : ''}
    ${S.imgs.length || S.draft.trim() ? `<button class="btn main" id="go" style="background:var(--deep)" ${S.loading ? 'disabled' : ''}>Find the fix</button>` : ''}
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
  </section>
  <section class="sec">
    <div class="row"><h2>Recent problems</h2>${S.cases.length > 3 ? `<button class="link" data-go="history">See all</button>` : ''}</div>
    ${recent.length ? recent.map(caseRow).join('') : `<p class="empty">${S.loading ? 'Loading…' : 'Nothing yet. Your problems and fixes will show here.'}</p>`}
  </section>`;
  if(S.typing && !S.draft){ const q = $('#q'); if(q) q.focus(); }
}
function caseRow(c){
  const o = c.status !== 'fixed';
  return `<button class="item" data-open="${esc(c.id)}"><span class="ic ${o?'o':''}">${ico.print}</span><span class="tx"><span class="t">${esc(c.title)}</span><span class="s">${esc(c.printer||'Any printer')} · ${fmtDate(c.updated_at)}</span></span><span class="pill ${esc(c.status)}">${STATUS[c.status]||''}</span></button>`;
}
function renderHistory(){
  const fixed = S.cases.filter(c => c.status === 'fixed').length;
  const rows = S.cases.filter(c => S.filter === 'all' || (S.filter === 'fixed' ? c.status === 'fixed' : c.status !== 'fixed'));
  const tab = (id, label) => `<button role="tab" data-filter="${id}" aria-selected="${S.filter===id}">${label}</button>`;
  app.innerHTML = `
  <h1 class="title">History</h1>
  <div class="stats">
    <div class="stat on"><b>${fixed}</b><span>Fixed</span></div>
    <div class="stat warn"><b>${S.cases.length - fixed}</b><span>Not fixed</span></div>
    <div class="stat"><b>${S.cases.length}</b><span>All problems</span></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Filter">${tab('all','All')}${tab('fixed','Fixed')}${tab('open','Not fixed')}</div>
  <div class="list">${rows.length ? rows.map(caseRow).join('') : `<p class="empty">${S.loading ? 'Loading…' : 'Nothing here yet.'}</p>`}</div>
  ${S.err ? `<div class="pad" style="margin-top:12px"><p class="err">${esc(S.err)}</p></div>` : ''}
  <section class="sec">
    <h2>What it has learned (${S.lessons.length})</h2>
    ${S.lessons.length ? `<ul class="lessons">${S.lessons.map(l => `<li><span class="kind ${esc(l.kind)}">${l.kind==='worked'?'Worked':'Didn’t work'}</span><span class="tx">${esc(l.text)}</span><button class="x" data-dellesson="${esc(l.id)}" aria-label="Forget this">×</button></li>`).join('')}</ul>` : `<p class="empty">Tap “Fixed it” or “Still broken” after an answer. It remembers both and gets better.</p>`}
  </section>`;
}
function renderPrinters(){
  const card = (p, i) => {
    const mine = S.cases.filter(c => c.printer === p);
    const learned = S.lessons.filter(l => l.kind === 'worked' && l.printer === p).length;
    return `<article class="pcard ${i%2?'o':''}">
      <div class="top"><div><h2>${esc(p)}</h2><small>${mine.length} problem${mine.length===1?'':'s'} so far</small></div><button class="rm" data-delprinter="${i}" aria-label="Remove ${esc(p)}">Remove</button></div>
      <div class="body">
        <div class="kv"><span>Last problem</span><b>${mine[0] ? esc(mine[0].title) + ' · ' + fmtDate(mine[0].updated_at) : 'None yet'}</b></div>
        <div class="kv"><span>Fixes learned</span><b>${learned}</b></div>
        <button class="btn dark" data-scanfor="${i}">Scan a problem</button>
      </div></article>`;
  };
  app.innerHTML = `
  <h1 class="title">My printers</h1>
  <div class="list" style="gap:14px;padding-top:0">
    ${S.printers.length ? S.printers.map(card).join('') : `<p class="empty">No printers yet. Add yours so advice is specific to it.</p>`}
    ${S.adding ? `<div class="addform"><input type="text" id="newpr" placeholder="Example: Bambu Lab A1" aria-label="Printer name"><button class="btn dark sm" id="savepr">Save</button><button class="btn sm" id="cancelpr">Cancel</button></div>` : `<button class="add" id="addprinter">+ Add a printer</button>`}
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
  </div>`;
  if(S.adding){ const i = $('#newpr'); if(i) i.focus(); }
}
function renderCase(){
  chrome('case');
  const c = S.cur;
  hdr.innerHTML = `<div class="chead"><div class="in"><button class="back" id="back" aria-label="Back">${ico.back}</button><div class="tt"><h1>${esc(c.title)}</h1><small>${esc(c.printer||'Any printer')}</small></div>${c.id ? `<button class="btn" id="delcase">Delete</button>` : ''}</div></div>`;
  const last = c.turns[c.turns.length-1];
  const showVerdict = !S.busy && last && last.role === 'assistant' && c.status === 'open';
  const hasSteps = (c.turns||[]).some(t => t.role === 'assistant' && /^\s*\d+[.)]\s/m.test(t.content));
  app.innerHTML = `<div class="msgs">
    ${(c.turns||[]).map(t => t.role === 'user' ? `<div class="msg user">${esc(t.content)}</div>` : `<div class="msg bot">${md(t.content)}</div>`).join('')}
    ${S.busy && S.ctl ? `<div class="msg bot"><span class="thinking"><span class="dot"></span>Looking closely… <span id="elapsed">0s</span></span></div>` : ''}
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ''}
    ${hasSteps && !S.busy ? `<p class="tip">Tip: tap a step to tick it off.</p>` : ''}
    ${showVerdict ? `<div class="verdict"><h3>Did it work?</h3><p>Tell me after the next print. This is how Print Doctor gets smarter.</p><div class="two"><button class="btn go" id="fixed">Fixed it ✓</button><button class="btn" id="notfixed">Still broken</button></div></div>` : ''}
    ${c.status === 'fixed' ? `<div class="verdict"><h3>Fixed</h3><p>Saved for next time: ${esc(c.lesson || '')}</p></div>` : ''}
    ${c.status === 'notfixed' && !S.busy ? `<div class="verdict"><h3>Saved what didn’t work</h3><p>Tell it what you see now below.</p></div>` : ''}
  </div>`;
  dock.innerHTML = `${thumbs()}<div class="in">
    <button class="ib" id="scan" aria-label="Add photo" ${S.busy?'disabled':''}>${ico.cam}</button>
    <textarea id="reply" rows="1" aria-label="Message" placeholder="${c.status==='fixed' ? 'Ask more…' : 'Tell it what you see now…'}">${esc(S.draft)}</textarea>
    ${S.busy && S.ctl ? `<button class="ib go" id="stop" aria-label="Stop">${ico.stop}</button>` : `<button class="ib go" id="send" aria-label="Send" ${S.busy?'disabled':''}>${ico.send}</button>`}
  </div>`;
}
function scrollEnd(){ requestAnimationFrame(() => { if(S.view === 'case') window.scrollTo({ top:document.body.scrollHeight }); }); }
function go(view){ S.view = view; S.err = ''; S.adding = false; render(); window.scrollTo(0,0); }

/* ---------- printers ---------- */
async function savePrinters(list){
  S.printers = list; render();
  try{ await post({ action:'printers', printers:list }); }catch(e){ if(!e.locked){ S.err = e.message; render(); } }
}
function savePrinter(){
  const name = ($('#newpr')?.value || '').trim(); S.adding = false;
  if(name && !S.printers.includes(name)){ S.draftPrinter = name; return savePrinters([...S.printers, name]); }
  render();
}

/* ---------- events ---------- */
document.addEventListener('submit', e => {
  if(e.target.id !== 'lockform') return;
  e.preventDefault();
  S.pass = $('#pass').value.trim(); if(!S.pass) return;
  lsSet('pd_pass', S.pass); S.view = 'home'; S.err = ''; loadAll();
});
document.addEventListener('input', e => { if(e.target.id === 'q' || e.target.id === 'reply'){ S.draft = e.target.value; if(e.target.id === 'q'){ const g = !!(S.imgs.length || S.draft.trim()); if(g !== !!$('#go')) render(), $('#q')?.focus(); } } });
document.addEventListener('keydown', e => {
  if(e.target.id === 'newpr' && e.key === 'Enter'){ e.preventDefault(); savePrinter(); }
  if(e.target.id === 'reply' && e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches){ e.preventDefault(); $('#send')?.click(); }
});
document.addEventListener('click', async e => {
  const li = e.target.closest('.msg.bot ol li'); if(li){ li.classList.toggle('done'); return; }
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.go) return go(d.go);
  if(d.pick !== undefined){ S.draftPrinter = d.pick; return render(); }
  if(d.filter){ S.filter = d.filter; return render(); }
  if(t.id === 'scan'){ cam.value = ''; return cam.click(); }
  if(t.id === 'gallery'){ picker.value = ''; return picker.click(); }
  if(t.id === 'type'){ S.typing = true; render(); return $('#q')?.focus(); }
  if(d.rmimg !== undefined){ S.imgs.splice(+d.rmimg, 1); return render(); }
  if(t.id === 'addprinter'){ S.adding = true; return render(); }
  if(t.id === 'savepr') return savePrinter();
  if(t.id === 'cancelpr'){ S.adding = false; return render(); }
  if(d.delprinter !== undefined) return savePrinters(S.printers.filter((_, i) => i !== +d.delprinter));
  if(d.scanfor !== undefined){ S.draftPrinter = S.printers[+d.scanfor] || ''; return go('home'); }
  if(t.id === 'logout'){ S.pass = ''; lsSet('pd_pass',''); S.view = 'lock'; return render(); }
  if(d.dellesson !== undefined){
    const id = d.dellesson; S.lessons = S.lessons.filter(l => String(l.id) !== id); render();
    try{ await post({ action:'deleteLesson', id }); }catch(e){ if(!e.locked){ S.err = e.message; render(); } }
    return;
  }
  if(d.open !== undefined){
    const row = S.cases.find(x => x.id === d.open);
    S.from = S.view; S.cur = { ...row, turns:[] }; S.view = 'case'; S.draft = ''; S.err = ''; S.imgs = []; S.busy = true; render(); window.scrollTo(0,0);
    try{ const r = await api('/api/print-doctor?r=data&case=' + encodeURIComponent(d.open)); S.cur = r.case; }catch(e){ if(!e.locked) S.err = e.message; }
    S.busy = false; render(); return scrollEnd();
  }
  if(t.id === 'back'){ S.ctl?.abort(); S.view = S.from || 'home'; S.cur = null; S.draft = ''; S.err = ''; S.imgs = []; render(); window.scrollTo(0,0); return loadAll(); }
  if(t.id === 'delcase'){
    if(!d.armed){ d.armed = '1'; t.textContent = 'Tap again'; setTimeout(() => { if(t.isConnected){ delete t.dataset.armed; t.textContent = 'Delete'; } }, 3000); return; }
    const id = S.cur.id; S.cases = S.cases.filter(x => x.id !== id); S.view = S.from || 'home'; S.cur = null; render();
    try{ await post({ action:'deleteCase', id }); }catch(e){ if(!e.locked){ S.err = e.message; render(); } }
    return;
  }
  if(t.id === 'stop') return S.ctl?.abort();
  if(t.id === 'fixed') return verdict(true);
  if(t.id === 'notfixed') return verdict(false);
  if(t.id === 'go'){
    const text = S.draft.trim();
    if(!text && !S.imgs.length){ S.err = 'Write the problem or add a photo first.'; return render(); }
    S.from = 'home'; S.cur = { id:null, title:'New problem', printer:S.draftPrinter, status:'open', turns:[] }; S.view = 'case'; S.typing = false;
    window.scrollTo(0,0);
    return ask(text);
  }
  if(t.id === 'send'){
    const text = S.draft.trim();
    if(!text && !S.imgs.length) return;
    return ask(text);
  }
});

/* ---------- start ---------- */
if(S.pass) loadAll(); else { S.view = 'lock'; render(); }
})();
</script>
</body>
</html>
